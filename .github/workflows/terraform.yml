name: Terraform CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  terraform:
    runs-on: ubuntu-latest

    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: us-east-1
      TF_VAR_aws_region: us-east-1
      TF_VAR_aws_profile: terraform
      TF_VAR_bucket_prefix: orlando-terraform
      TF_VAR_force_destroy: "true"
      TF_VAR_environment: estudo
      TF_VAR_project_number: "1"
      TF_VAR_allowed_extensions: '["jpg","png","pdf","txt"]'
      TF_VAR_common_tags: '{"ManagedBy":"Terraform","Project":"Curso"}'

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Instalar Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Configurar perfil AWS
        run: |
          aws configure set aws_access_key_id "$AWS_ACCESS_KEY_ID" --profile terraform
          aws configure set aws_secret_access_key "$AWS_SECRET_ACCESS_KEY" --profile terraform
          aws configure set region "$AWS_DEFAULT_REGION" --profile terraform

      - name: Verificar autenticação AWS
        run: aws sts get-caller-identity --profile terraform

      - name: Terraform Format
        run: terraform fmt -
